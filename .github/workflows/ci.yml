name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (with coverage ratchet)
        # TST-05: --cov-fail-under is the regression floor (current app-source
        # coverage ≈ 55%). A deliberate drop below it fails CI. Raise the floor
        # as coverage climbs; never lower it. Scope/omit live in .coveragerc.
        run: python -m pytest -q --cov=. --cov-report=term-missing --cov-fail-under=55

  frontend:
    name: Frontend (lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Type-check (API contract type-tests)
        run: pnpm run typecheck
      - name: Unit tests (Vitest, with coverage ratchet)
        # TST-05: coverage thresholds in vitest.config.ts are the regression
        # floor; a deliberate drop fails CI. Raise them as coverage climbs.
        run: pnpm run test:coverage
      - name: Build
        run: pnpm run build

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright smoke
        run: pnpm run test:e2e
